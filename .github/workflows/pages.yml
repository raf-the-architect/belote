name: Publier sur GitHub Pages

# Construit le site et le publie sur GitHub Pages (aucun serveur nécessaire :
# le solo tourne entièrement dans la page, le mode en ligne attend l'adresse
# d'un serveur de jeu, saisissable depuis l'écran Multijoueur).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Active GitHub Pages automatiquement si ce n'est pas déjà fait
      # (évite d'avoir à toucher aux réglages du dépôt)
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Vérifications
        run: |
          npm run typecheck
          npm test

      - name: Build du site statique
        run: npx vite build --base=./

      - name: Fichiers complémentaires (SPA dans un sous-dossier)
        run: |
          cp static/404.html dist/404.html
          touch dist/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
