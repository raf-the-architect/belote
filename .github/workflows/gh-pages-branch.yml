name: Publier sur la branche gh-pages

# Variante « dépôt → branche » : à utiliser si le dépôt publie GitHub Pages
# depuis une branche (Settings → Pages → Source : Deploy from a branch → gh-pages).
# Le site est publié à la racine du sous-dossier du dépôt :
#   https://<utilisateur>.github.io/<depot>/

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build du site statique (chemins relatifs)
        run: npx vite build --base=./

      - name: Fichiers complémentaires
        run: |
          cp static/404.html dist/404.html
          touch dist/.nojekyll

      - name: Publication sur gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          force_orphan: true
